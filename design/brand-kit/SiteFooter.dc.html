<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#0F1130;color:#F4F2EC;overflow:hidden;font-family:'Roboto',sans-serif;display:block;width:100%">
  <div style="max-width:1440px;margin:0 auto;padding:clamp(64px,7vw,96px) clamp(24px,4.5vw,72px) 28px;display:flex;flex-direction:column;gap:clamp(48px,5vw,72px);box-sizing:border-box">
    <div style="display:grid;grid-template-columns:{{ grid }};gap:44px clamp(24px,3vw,56px);align-items:start">
      <div style="display:flex;flex-direction:column;gap:20px;grid-column:{{ brandCol }};max-width:380px;min-width:0">
        <img src="assets/logo-new.png" alt="Cypress Hills" style="width:170px;height:auto;display:block">
        <div style="font-size:14px;line-height:22px;color:#9A9CB8;text-wrap:pretty">Caledon, Nobleton, King City, Vaughan, Kleinburg, Woodbridge, Muskoka, Collingwood, Toronto, and Surrounding Areas</div>
        <div style="display:flex;align-items:center;gap:10px">
          <a href="https://www.facebook.com/cypresshillslandscaping" aria-label="Facebook" title="Facebook" style="width:38px;height:38px;border-radius:10px;border:1px solid #2E3270;display:flex;align-items:center;justify-content:center;color:#55B847;text-decoration:none;transition:background .2s, color .2s, border-color .2s, transform .2s" style-hover="background:#55B847;border-color:#55B847;color:#0F1130;transform:translateY(-2px)"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"></path></svg></a>
          <a href="https://www.instagram.com/cypresshills.landscaping/" aria-label="Instagram" title="Instagram" style="width:38px;height:38px;border-radius:10px;border:1px solid #2E3270;display:flex;align-items:center;justify-content:center;color:#55B847;text-decoration:none;transition:background .2s, color .2s, border-color .2s, transform .2s" style-hover="background:#55B847;border-color:#55B847;color:#0F1130;transform:translateY(-2px)"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM12 3c-2.4 0-2.7 0-3.7.1-3.3.1-5 1.9-5.2 5.2C3 9.3 3 9.6 3 12s0 2.7.1 3.7c.1 3.3 1.9 5 5.2 5.2 1 .1 1.3.1 3.7.1s2.7 0 3.7-.1c3.3-.1 5-1.9 5.2-5.2.1-1 .1-1.3.1-3.7s0-2.7-.1-3.7c-.1-3.3-1.9-5-5.2-5.2C14.7 3 14.4 3 12 3z"></path></svg></a>
        </div>
      </div>
      <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <div style="font-size:12px;line-height:12px;letter-spacing:.16em;text-transform:uppercase;color:#55B847;font-weight:700;padding-bottom:6px">{{ col.title }}</div>
          <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="color:#F4F2EC;font-size:15px;line-height:22px;text-decoration:none" style-hover="color:#55B847">{{ l.label }}</a></sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;font-size:13px;line-height:20px;color:#9A9CB8;border-top:1px solid #262A60;padding-top:24px;align-items:center">
      <span>© 2026 Cypress Hills Landscaping &amp; Snow Removal Inc.</span>
      <a href="Contact.dc.html" style="color:#9A9CB8;text-decoration:none" style-hover="color:#FFFFFF">Book a site visit →</a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;520px&quot;}}">
class Component extends DCLogic {
  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1400 };
  componentDidMount() { this.onRz = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onRz); }
  componentWillUnmount() { window.removeEventListener('resize', this.onRz); }
  renderVals() {
    const v = this.state.vw;
    const grid = v >= 1180 ? 'minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr)' : v >= 560 ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)';
    return { grid, brandCol: v >= 1180 ? 'auto' : '1 / -1', cols: [
      { title: 'Menu', links: [{ label: 'Home', href: 'Cypress%20Hills%20Home%20v2.dc.html' }, { label: 'Services', href: 'Services.dc.html' }, { label: 'Pools', href: 'Pools.dc.html' }, { label: 'Projects', href: 'Projects.dc.html' }, { label: 'Contact Us', href: 'Contact.dc.html' }] },
      { title: 'Services', links: [{ label: 'Backyard Putting Greens', href: 'Backyard%20Putting%20Greens.dc.html' }, { label: 'Golf Course Shaping', href: 'Golf%20Course%20Shaping.dc.html' }, { label: 'Armor Stone Walls', href: 'Armor%20Stone%20Walls.dc.html' }, { label: 'Artificial Grass Installation', href: 'Artificial%20Grass%20Installation.dc.html' }, { label: 'Synthetic Turf Installation', href: 'Synthetic%20Turf%20Installation.dc.html' }] },
      { title: 'Pools', links: [{ label: 'Fiberglass Pool Installation', href: 'Fiberglass%20Pool%20Installation.dc.html' }, { label: 'Swimming Pool Installation Caledon ON', href: 'Swimming%20Pool%20Installation%20Caledon.dc.html' }] },
      { title: 'Contact', links: [{ label: '(905) 866-4111', href: 'tel:+19058664111' }, { label: 'Monday-Friday, 7 a.m.-5 p.m.', href: 'Contact.dc.html' }] }
    ] };
  }
}
</script>
</body>
</html>
